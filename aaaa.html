<!DOCTYPE html>
<html lang="es">
<head>

  <style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  font-family: "Quicksand", sans-serif;
  background: #ffecec;
  -webkit-tap-highlight-color: transparent;
}

.scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 1s ease, visibility 1s ease;
}

.scene.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

#intro-scene {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,255,255,.9), transparent 35%),
    linear-gradient(135deg, #ffe5ec, #fff7f8 55%, #ffdce5);
}

.intro-content {
  text-align: center;
  padding: 30px;
  animation: introFloat 3s ease-in-out infinite;
}

.intro-heart {
  font-size: clamp(4rem, 12vw, 8rem);
  filter: drop-shadow(0 10px 25px rgba(190, 55, 75, .25));
  animation: heartBeat 1.5s ease-in-out infinite;
}

.intro-title {
  margin: 15px 0 8px;
  color: #9e293d;
  font-size: clamp(1.8rem, 5vw, 3rem);
}

.intro-subtitle {
  margin: 0 0 28px;
  color: #70454d;
  font-size: clamp(1rem, 2.5vw, 1.25rem);
}

.open-button, .continue-button {
  border: 0;
  border-radius: 999px;
  padding: 14px 28px;
  font: 700 1rem "Quicksand", sans-serif;
  color: white;
  background: linear-gradient(135deg, #d14d63, #a92e49);
  box-shadow: 0 12px 30px rgba(169, 46, 73, .25);
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
}

.open-button:hover, .continue-button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 16px 35px rgba(169, 46, 73, .35);
}

.open-button:active, .continue-button:active { transform: scale(.97); }

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

@keyframes introFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

#envelope-scene {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(to bottom right, #ffecec, #fff5f5, #ffebeb);
}

.envelope-wrapper {
  width: min(92vw, 650px);
  text-align: center;
}

.envelope-hint {
  margin-bottom: 25px;
  color: #9e293d;
  font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 700;
  animation: hintPulse 1.8s ease-in-out infinite;
}

@keyframes hintPulse {
  0%, 100% { opacity: .65; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-4px); }
}

.envelope-wrapper .envelope { margin: 0 auto; }

.envelope.open {
  --envelope-transform: var(--envelope-transform-hover, 0deg);
  --evelope-rotate-delay: var(--evelope-rotate-delay-hover);
  --shadow-transform: rotateY(180deg);
  --fold-rotate: var(--fold-rotate-hover);
  --fold-delay: var(--fold-delay-hover);
  --fold-zindex: var(--fold-zindex-hover);
  --letter-height: var(--letter-height-hover);
  --letter-delay: var(--letter-delay-hover);
}

#flowers-scene {
  background: #000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

#flowers-stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#flowers-stage .flowers {
  position: relative;
}

.flowers-message {
  position: absolute;
  z-index: 1000;
  top: 5vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(90vw, 900px);
  color: #ffe918;
  text-align: center;
  font-size: clamp(1.2rem, 3.2vw, 2.6rem);
  line-height: 1.35;
  opacity: 0;
  text-shadow: 0 0 15px rgba(255, 233, 24, .35);
}

.flowers-message.show {
  animation: finalMessage 3s ease-in-out forwards;
}

@keyframes finalMessage {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.restart-button {
  position: absolute;
  z-index: 2000;
  right: 20px;
  bottom: 20px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 999px;
  padding: 9px 16px;
  color: white;
  background: rgba(0,0,0,.35);
  backdrop-filter: blur(8px);
  cursor: pointer;
  opacity: .65;
}

.restart-button:hover { opacity: 1; }

#flowers-stage .night,
#flowers-stage .flowers {
  position: absolute;
}

#flowers-stage .night {
  inset: 0;
  left: 0;
  top: 0;
  transform: none;
  width: 100%;
  height: 100%;
}

#flowers-stage .flowers {
  left: 50%;
  bottom: 0;
  transform: translateX(-50%) scale(.9);
  width: 100%;
  height: 100%;
}

*,
::before,
::after {
	box-sizing: border-box;
}
body  {
	font-family: "Quicksand", sans-serif;
	background: linear-gradient(to bottom right, #ffecec, #fff5f5, #ffebeb);
	color: #333;
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	margin: 0;
	padding: 1rem;
	margin-top: 50px;
	overflow: hidden;
	-webkit-tap-highlight-color: transparent;
  }
.envelope {
	--duration: 1000ms;

	--shadow-width: calc(var(--envelope-width) * 0.85);
	--shadow-blur: 15px;

	--envelope-width: 300px;
	--envelope-height: 175px;
	--envelope-clr-bg: #d14d44;
	--envelope-clr-bg-side: #c24e46;
	--envelope-clr-bg-bottom: #e15349;
	--envelope-clr-bg-top: #d14d44;
	--envelope-clr-txt: #fff;

	/*--envelope-transform: rotateY(0deg);*/
	--envelope-transform-hover: rotateY(180deg);
	--evelope-rotate-delay: calc(var(--duration) / 1);
	--evelope-rotate-delay-hover: 0ms;

	--letter-clr-bg: #fff;
	--letter-clr-text: #c0392b;
	--letter-font-size: 1rem;
	--letter-delay: 0ms;
	--letter-delay-hover: calc(
		var(--duration) * 1.25
	); /* delay before revealing card */

	--letter-height: calc(var(--envelope-height) - 2rem);
	--letter-height-hover: calc(var(--envelope-height) * 1.75);

	--fold-rotate: rotateX(0deg);
	/*--fold-zindex: 10;*/
	--fold-zindex-hover: 0;
	--fold-rotate-hover: rotateX(180deg);
	--fold-delay: calc(var(--duration) / 2); /* delay before opening top section */
	--fold-delay-hover: calc(var(--duration) * .75);

	--front-font-size: 1rem;
	--snowman-width: 50px;
	--bells-width: 30px;

	position: relative;
	height: var(--envelope-height);
	width: var(--envelope-width);
	perspective: 1000px;
	cursor: pointer;
}

@media (min-width: 720px) {
	.envelope {
		--envelope-width: 600px;
		--envelope-height: 350px;
		--letter-font-size: 1.6rem;
		--snowman-width: 130px;
		--bells-width: 60px;
		--front-font-size: 1.25rem;
	}
}
/* shadow */
.envelope::after {
	content: "";
	position: absolute;
	top: 110%;
	left: 50%;
	width: var(--shadow-width);
	height: 40px;
	transition: var(--duration) ease-in-out;
	transition-delay: var(--evelope-rotate-delay);
	transform: var(--shadow-transform);
	translate: -50% 0;
	border-radius: 50%;
	background: rgba(56, 6, 6, 0.4);
	filter: blur(var(--shadow-blur));
}

.envelope.open {
	--envelope-transform: var(--envelope-transform-hover, 0deg);
	--evelope-rotate-delay: var(--evelope-rotate-delay-hover);
	--shadow-transform: rotateY(180deg);
	--fold-rotate: var(--fold-rotate-hover);
	--fold-delay: var(--fold-delay-hover);
	--fold-zindex: var(--fold-zindex-hover);
	--letter-height: var(--letter-height-hover);
	--letter-delay: var(--letter-delay-hover);
}

.envelope-inner {
	position: relative;
	width: 100%;
	height: 100%;

	transition: var(--duration) ease-in-out;
	transition-delay: var(--evelope-rotate-delay);
	transform-style: preserve-3d;
	transform: var(--envelope-transform);
	display: grid;
}

.envelope-front,
.envelope-back {
	position: relative;
	grid-area: 1/1;
	width: 100%;
	height: 100%;
	background-color: var(--envelope-clr-bg);
	-webkit-backface-visibility: hidden;
	backface-visibility: hidden;
	perspective: 1000px;
	isolation: isolate;
}

.envelope-front {
	color: var(--envelope-clr-txt);
	display: grid;
	place-content: center;
}
.envelope-front .postage-stamp {
	position: absolute;
	top: 1em;
	right: 0.5em;
	width: 15%;
}
.envelope-front .address {
	text-align: left;
	font-size: var(--front-font-size);
}
.envelope-front .address > p > span:first-child {
	font-family: system-ui;
	font-weight: 200;
}
.envelope-front .address > p > span:last-of-type {
	font-weight: 800;
}

.envelope-back {
	/* start with back rotated*/
	transform: rotateY(180deg);
}
/* back folds */
.envelope-back::after {
	content: "";
	position: absolute;
	inset: 0;
	z-index: 3;
	background-image: conic-gradient(
		transparent 60deg,
		var(--envelope-clr-bg-side) 60deg 120deg,
		var(--envelope-clr-bg-bottom) 120deg 240deg,
		var(--envelope-clr-bg-side) 240deg 300deg,
		transparent 300deg
	);
}
/* top fold which folds up on hover */
.envelope-back .top-fold {
	position: absolute;
	inset: 0;
	z-index: var(--fold-zindex, 10);
	background-color: var(--envelope-clr-bg-top);
	clip-path: polygon(0% 0%, 50% 55%, 100% 0%);

	transform: var(--fold-rotate);
	transform-origin: top;
	transition: var(--duration) ease-in-out;
	transition-delay: var(--fold-delay);
}

.letter {
	position: absolute;
	bottom: 5px;
	left: 50%;
	width: 90%;
	height: var(--letter-height);
	font-size: var(--letter-font-size);
	transform: translateX(-50%);
	background: var(--letter-clr-bg);
	z-index: 2;
	padding: 2em 3em;
	display: flex;
	flex-direction: column;
	gap: 1rem;
	align-items: center;
	text-align: center;
	transition: var(--duration) ease-in-out;
	transition-delay: var(--letter-delay);
	overflow: hidden;
}
.letter > svg.snowman {
	width: var(--snowman-width);
}
.letter svg.bells {
	width: var(--bells-width);
	color: orange;
}
.letter p {
	margin: 0;
	font-weight: bold;
	width: 32ch;
	color: var(--letter-clr-text);
}

.custom-image {

}
.custom-image2 {

.highlight {

<script>
const introScene = document.getElementById("intro-scene");
const envelopeScene = document.getElementById("envelope-scene");
const flowersScene = document.getElementById("flowers-scene");
const startButton = document.getElementById("startButton");
const continueButton = document.getElementById("continueButton");
const restartButton = document.getElementById("restartButton");
const envelope = document.querySelector("#envelope-scene .envelope");
const envelopeHint = document.getElementById("envelopeHint");
const flowersStage = document.getElementById("flowers-stage");
const flowersTemplate = document.getElementById("flowers-template");
const flowersMessage = document.getElementById("flowersMessage");

function showScene(scene) {
  document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
  scene.classList.add("active");
}

startButton.addEventListener("click", () => {
  showScene(envelopeScene);
});

envelope.addEventListener("click", () => {
  if (envelope.classList.contains("open")) return;

  envelope.classList.add("open");
  envelopeHint.textContent = "💖 Abriendo tu carta...";

  setTimeout(() => {
    continueButton.style.display = "inline-block";
    envelopeHint.textContent = "💌 Para ti, con mucho cariño";
  }, 2800);
});

continueButton.addEventListener("click", () => {
  showScene(flowersScene);

  // Volvemos a insertar TODA la escena de flores.
  // Esto reinicia sus keyframes desde 0 y evita que la animación
  // termine mientras el usuario todavía está viendo la carta.
  flowersStage.querySelectorAll(".night, .flowers").forEach(el => el.remove());

  flowersStage.insertAdjacentHTML("beforeend", flowersTemplate.innerHTML);

  flowersMessage.classList.remove("show");
  void flowersMessage.offsetWidth;
  flowersMessage.classList.add("show");
});

restartButton.addEventListener("click", () => {
  envelope.classList.remove("open");
  continueButton.style.display = "none";
  envelopeHint.textContent = "💌 Haz click en el sobre para abrirlo";
  flowersMessage.classList.remove("show");

  flowersStage.querySelectorAll(".night, .flowers").forEach(el => el.remove());

  showScene(introScene);
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    envelope.classList.remove("open");
    continueButton.style.display = "none";
    envelopeHint.textContent = "💌 Haz click en el sobre para abrirlo";
    flowersMessage.classList.remove("show");
    flowersStage.querySelectorAll(".night, .flowers").forEach(el => el.remove());
    showScene(introScene);
  }
});
</script>
